[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-quant-trade"
version = "0.1.0"
description = "Safe foundation for a personal CN A-share research platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
ai-quant-trade = "ai_quant_trade.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_quant_trade"]

[dependency-groups]
dev = [
  "mypy>=1.10,<2",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "pytest-socket>=0.7,<1",
  "pyyaml>=6,<7",
  "ruff>=0.12,<0.16",
  "types-PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket -ra"

[tool.coverage.run]
branch = true
source = ["ai_quant_trade"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/ai_quant_trade", "tests", "scripts"]
